worker_processes auto;

events {
}

http {

    client_max_body_size 6M;

    upstream backend-servers {
        server backend:8080;
    }

    upstream frontend-servers {
        server frontend:80;
    }

    server {
        listen 80;

        server_name cloudStarageServer;

        location /api/ {
            proxy_pass http://backend-servers;
        }

        location / {
            proxy_pass http://frontend-servers;
        }
    }
}