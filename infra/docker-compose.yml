version: '3.8'

services:

  user:
    container_name: user
    build: ../user
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - cloud-storage-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - cloud-storage-network

  redis:
    image: redis:8-alpine
    container_name: redis
    volumes:
      - rs_data:/var/lib/redis/data
    networks:
      - cloud-storage-network

networks:
  cloud-storage-network:

volumes:
  data:
  rs_data: