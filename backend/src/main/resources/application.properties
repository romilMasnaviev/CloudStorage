spring.application.name=backend
#Database
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
#Migrations
spring.flyway.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}
#Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
#Minio
minio.endpoint=http://minio:9000
minio.username=${MINIO_USER}
minio.password=${MINIO_PASSWORD}
minio.bucket.name=user-files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
#Ducumentation
springdoc.override-with-generic-response=false